<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louis 个人穿搭管理系统</title>
  <style>
    :root {
      --ink: #24231f;
      --muted: #6d6a60;
      --paper: #f6f2e9;
      --panel: #fffcf5;
      --line: #d8d0c1;
      --soft: #eee7da;
      --charcoal: #373735;
      --olive: #58614c;
      --navy: #26384f;
      --coffee: #5a4638;
      --khaki: #a89167;
      --cream: #e9ddc8;
      --sage: #87907f;
      --silver: #bcc0bf;
      --pink: #d8a8a8;
      --blue: #4e7297;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(36,35,31,.035) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(180deg, rgba(36,35,31,.028) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--paper);
      font-family: "Hiragino Sans GB", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      letter-spacing: 0;
    }

    button, select, input { font: inherit; }

    .shell {
      width: min(1500px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 26px 0 52px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -16px 18px;
      padding: 12px 16px;
      background: rgba(246, 242, 233, .94);
      border-bottom: 1px solid rgba(36, 35, 31, .12);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      width: min(1500px, calc(100vw - 32px));
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(30px, 4vw, 62px);
      line-height: .98;
      font-weight: 500;
      letter-spacing: 0;
    }

    .kicker, .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .kicker { margin-top: 10px; color: var(--muted); font-size: 14px; }
    .actions { justify-content: flex-end; }

    .btn, .chip {
      min-height: 34px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 252, 245, .78);
      color: var(--ink);
      padding: 7px 11px;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover, .chip:hover, .chip.active {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--panel);
    }

    .board {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 20px;
      align-items: start;
    }

    aside {
      position: sticky;
      top: 86px;
      border: 1px solid var(--line);
      background: rgba(255, 252, 245, .76);
      padding: 16px;
      max-height: calc(100vh - 110px);
      overflow: auto;
    }

    .section-title {
      margin: 0 0 10px;
      font-size: 15px;
      font-weight: 700;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 18px;
    }

    .stat {
      border: 1px solid rgba(36, 35, 31, .14);
      background: rgba(246, 242, 233, .7);
      padding: 10px;
      min-height: 70px;
    }

    .stat strong { display: block; font-family: Georgia, serif; font-size: 25px; line-height: 1; }
    .stat span { display: block; margin-top: 7px; color: var(--muted); font-size: 12px; }

    .weather-panel {
      display: grid;
      gap: 8px;
      margin-bottom: 18px;
    }

    .weather-now, .weather-day, .system-note {
      border: 1px solid rgba(36,35,31,.13);
      background: rgba(246, 242, 233, .62);
      padding: 10px;
    }

    .weather-now strong { display: block; font-size: 16px; }
    .weather-now span, .weather-day span, .system-note { color: var(--muted); font-size: 12px; line-height: 1.5; }

    .weather-strip { display: grid; gap: 7px; }
    .weather-day { display: grid; grid-template-columns: 46px 1fr; gap: 9px; align-items: center; }
    .weather-date { font-family: Georgia, serif; font-size: 18px; line-height: 1; }
    .weather-day b { display: block; font-size: 13px; }

    .control-group { margin-bottom: 18px; }
    .chip-grid { display: flex; flex-wrap: wrap; gap: 7px; }

    .search {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 8px 10px;
      margin-bottom: 9px;
      border-radius: 0;
    }

    .select-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
    select {
      width: 100%;
      min-height: 38px;
      border: 1px solid var(--line);
      background: var(--panel);
      color: var(--ink);
      padding: 8px;
      border-radius: 0;
    }

    .selected-items { display: flex; flex-wrap: wrap; gap: 7px; margin-top: 8px; }
    .selected-items .chip { background: var(--ink); color: var(--panel); border-color: var(--ink); }

    .main-tools {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
      gap: 14px;
    }

    .card {
      border: 1px solid rgba(36, 35, 31, .16);
      background: var(--panel);
      min-height: 420px;
      display: grid;
      grid-template-rows: auto 440px 1fr;
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 8px;
    }

    .id { font-family: Georgia, serif; font-size: 29px; line-height: 1; }
    .scene { text-align: right; color: var(--muted); font-size: 12px; line-height: 1.4; }

    .fit-visual {
      margin: 0 14px;
      border: 1px solid rgba(36, 35, 31, .12);
      background: #e6e1d7;
      overflow: hidden;
    }

    .look-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      filter: saturate(.88) contrast(.98);
    }

    .details { padding: 12px 14px 14px; display: grid; gap: 8px; }
    .row { display: grid; grid-template-columns: 42px 1fr; gap: 8px; align-items: baseline; font-size: 13px; line-height: 1.45; }
    .row b { color: var(--muted); font-size: 12px; font-weight: 500; }
    .tags { display: flex; flex-wrap: wrap; gap: 6px; padding-top: 2px; }
    .tag { border: 1px solid rgba(36,35,31,.14); color: var(--muted); font-size: 11px; padding: 4px 7px; background: rgba(246,242,233,.55); }
    .note { margin-top: 2px; padding-top: 10px; border-top: 1px dashed rgba(36,35,31,.18); color: var(--muted); font-size: 12px; line-height: 1.5; }
    .empty { display: none; padding: 32px; color: var(--muted); border: 1px solid var(--line); background: var(--panel); }

    @media (max-width: 960px) {
      .topbar-inner, .board, .main-tools { grid-template-columns: 1fr; }
      .actions { justify-content: start; }
      aside { position: static; max-height: none; }
    }

    @media (max-width: 560px) {
      .shell { width: min(100vw - 18px, 1500px); padding-top: 14px; }
      .topbar { margin: 0 -9px 14px; }
      .gallery { grid-template-columns: 1fr; }
      .card { grid-template-rows: auto 460px 1fr; }
      .select-row { grid-template-columns: 1fr; }
    }

    @media print {
      body { background: #fff; }
      .topbar, aside { position: static; }
      .actions, .control-group, .main-tools { display: none; }
      .board { display: block; }
      .gallery { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .card { break-inside: avoid; min-height: 385px; }
    }
  </style>
</head>
<body>
  <div class="topbar">
    <div class="topbar-inner">
      <div>
        <h1>Louis 个人穿搭管理系统</h1>
        <div class="kicker">
          <span>单品库驱动</span>
          <span>实时天气</span>
          <span>四季扩展</span>
          <span>72 套夏日 Look</span>
        </div>
      </div>
      <div class="actions">
        <button class="btn" type="button" id="resetBtn">重置筛选</button>
        <button class="btn" type="button" id="todayBtn">按今日天气推荐</button>
        <button class="btn" type="button" id="printBtn">打印 / 存 PDF</button>
      </div>
    </div>
  </div>

  <main class="shell">
    <section class="board">
      <aside>
        <h2 class="section-title">系统索引</h2>
        <div class="stat-grid">
          <div class="stat"><strong id="visibleCount">0</strong><span>当前显示</span></div>
          <div class="stat"><strong id="lookCount">0</strong><span>Look 总数</span></div>
          <div class="stat"><strong id="itemCount">0</strong><span>单品数量</span></div>
          <div class="stat"><strong>v1</strong><span>JSON 数据版</span></div>
        </div>

        <h2 class="section-title">福州仓山实时天气</h2>
        <div class="weather-panel">
          <div class="weather-now" id="weatherNow"><strong>天气加载中</strong><span>正在读取近 7 天天气。</span></div>
          <div class="weather-strip" id="weatherStrip"></div>
        </div>

        <div class="control-group">
          <h2 class="section-title">单品筛选</h2>
          <input class="search" id="itemSearch" type="search" placeholder="搜索单品，例如 黑色 T / 军绿 / 德训鞋">
          <div class="chip-grid" id="categoryFilters"></div>
          <div class="chip-grid" id="itemFilters"></div>
          <div class="selected-items" id="selectedItems"></div>
        </div>

        <div class="control-group">
          <h2 class="section-title">辅助筛选</h2>
          <div class="select-row">
            <select id="seasonFilter" aria-label="季节筛选"></select>
            <select id="weatherFilter" aria-label="天气筛选"></select>
            <select id="sceneFilter" aria-label="场景筛选"></select>
            <select id="colorFilter" aria-label="颜色筛选"></select>
          </div>
        </div>

        <h2 class="section-title">新增单品方式</h2>
        <div class="system-note">
          v1 暂不接后台。新增单品先改 <code>data/items.json</code>，新增穿搭改 <code>data/looks.json</code>，图片放进 <code>assets/louis-summer-looks/</code>。以后需要手机端新增、登录和同步时，再把 JSON 数据源替换成后台数据库。
        </div>
      </aside>

      <section>
        <div class="main-tools">
          <div class="kicker" id="activeSummary">正在加载数据。</div>
          <div class="actions"><button class="btn" type="button" id="clearItemsBtn">清空单品</button></div>
        </div>
        <div class="gallery" id="gallery"></div>
        <div class="empty" id="empty">没有符合条件的 Look。</div>
      </section>
    </section>
  </main>

  <script>
    const DATA = { items: [], looks: [] };
    const selectedItemIds = new Set();
    let activeCategory = 'all';
    let currentWeatherTag = '';

    const categoryLabels = {
      all: '全部', tops: '上衣', outerwear: '外层', bottoms: '裤装', shoes: '鞋', bags: '包', accessories: '配饰'
    };
    const seasonLabels = { all: '全部季节', summer: '夏装', autumn: '秋装', winter: '冬装', spring: '春装' };
    const weatherLabels = { all: '全部天气', sunny: '晴热/防晒', cloudy: '阴天/多云', rain: '雨天', evening: '傍晚/饭局', weekend: '周末', commute: '通勤' };
    const colorLabels = { all: '全部颜色', black: '黑色', charcoal: '炭灰', gray: '灰色', greige: '灰褐', cream: '奶油白', beige: '米色', khaki: '卡其', olive: '军绿', sage: '鼠尾草绿', coffee: '深咖', brown: '棕色', navy: '藏蓝', pink: '水洗粉', blue: '蓝色', green: '绿色', silver: '银色', neutral: '中性色' };

    const weatherCodeMap = {
      0: ['晴', 'sunny'], 1: ['大部晴朗', 'sunny'], 2: ['多云', 'cloudy'], 3: ['阴', 'cloudy'],
      45: ['雾', 'cloudy'], 48: ['雾凇', 'cloudy'], 51: ['小毛毛雨', 'rain'], 53: ['毛毛雨', 'rain'], 55: ['较强毛毛雨', 'rain'],
      61: ['小雨', 'rain'], 63: ['中雨', 'rain'], 65: ['大雨', 'rain'], 80: ['阵雨', 'rain'], 81: ['阵雨', 'rain'], 82: ['强阵雨', 'rain'],
      95: ['雷阵雨', 'rain'], 96: ['雷阵雨伴冰雹', 'rain'], 99: ['强雷阵雨伴冰雹', 'rain']
    };

    const els = {
      gallery: document.querySelector('#gallery'), empty: document.querySelector('#empty'), visibleCount: document.querySelector('#visibleCount'),
      lookCount: document.querySelector('#lookCount'), itemCount: document.querySelector('#itemCount'), itemSearch: document.querySelector('#itemSearch'),
      categoryFilters: document.querySelector('#categoryFilters'), itemFilters: document.querySelector('#itemFilters'), selectedItems: document.querySelector('#selectedItems'),
      seasonFilter: document.querySelector('#seasonFilter'), weatherFilter: document.querySelector('#weatherFilter'), sceneFilter: document.querySelector('#sceneFilter'),
      colorFilter: document.querySelector('#colorFilter'), weatherNow: document.querySelector('#weatherNow'), weatherStrip: document.querySelector('#weatherStrip'),
      activeSummary: document.querySelector('#activeSummary')
    };

    function itemById(id) { return DATA.items.find(item => item.id === id); }
    function labelFrom(map, key) { return map[key] || key; }

    function formatDate(iso) {
      const date = new Date(`${iso}T00:00:00+08:00`);
      return `${date.getMonth() + 1}/${date.getDate()}`;
    }

    function weekday(iso) {
      const days = ['周日','周一','周二','周三','周四','周五','周六'];
      return days[new Date(`${iso}T00:00:00+08:00`).getDay()];
    }

    function weatherInfo(code) { return weatherCodeMap[code] || ['天气变化', 'cloudy']; }

    async function loadWeather() {
      const url = 'https://api.open-meteo.com/v1/forecast?latitude=26.0471&longitude=119.3035&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max&timezone=Asia%2FShanghai&forecast_days=7';
      try {
        const res = await fetch(url, { cache: 'no-store' });
        if (!res.ok) throw new Error(`weather ${res.status}`);
        const data = await res.json();
        const days = data.daily.time.map((date, index) => {
          const [text, tag] = weatherInfo(data.daily.weather_code[index]);
          return { date, text, tag, max: Math.round(data.daily.temperature_2m_max[index]), min: Math.round(data.daily.temperature_2m_min[index]), rain: data.daily.precipitation_probability_max[index] ?? 0 };
        });
        currentWeatherTag = days[0]?.tag || '';
        renderWeather(days);
      } catch (error) {
        currentWeatherTag = '';
        els.weatherNow.innerHTML = '<strong>天气暂时不可用</strong><span>实时天气读取失败，筛选仍可手动选择天气类型。</span>';
        els.weatherStrip.innerHTML = '';
      }
    }

    function renderWeather(days) {
      const today = days[0];
      els.weatherNow.innerHTML = `<strong>今日 ${today.text} · ${today.min}-${today.max}C</strong><span>降水概率 ${today.rain}% · 数据来自 Open-Meteo，页面打开时实时读取。</span>`;
      els.weatherStrip.innerHTML = days.map(day => `
        <div class="weather-day">
          <div class="weather-date">${formatDate(day.date)}</div>
          <div><b>${weekday(day.date)} · ${day.text}</b><span>${day.min}-${day.max}C · 降水 ${day.rain}%</span></div>
        </div>
      `).join('');
    }

    function buildSelect(select, entries, selected = 'all') {
      select.innerHTML = entries.map(([value, label]) => `<option value="${value}" ${value === selected ? 'selected' : ''}>${label}</option>`).join('');
    }

    function initControls() {
      const scenes = [...new Set(DATA.looks.map(look => look.scene))].sort((a, b) => a.localeCompare(b, 'zh-Hans-CN'));
      const seasons = [...new Set(DATA.looks.flatMap(look => look.season))];
      const colors = [...new Set(DATA.items.flatMap(item => item.colors))].sort();
      buildSelect(els.seasonFilter, [['all', '全部季节'], ...seasons.map(key => [key, labelFrom(seasonLabels, key)])]);
      buildSelect(els.weatherFilter, Object.entries(weatherLabels));
      buildSelect(els.sceneFilter, [['all', '全部场景'], ...scenes.map(scene => [scene, scene])]);
      buildSelect(els.colorFilter, [['all', '全部颜色'], ...colors.map(key => [key, labelFrom(colorLabels, key)])]);
      renderCategoryFilters();
      renderItemFilters();
    }

    function renderCategoryFilters() {
      const categories = ['all', 'tops', 'outerwear', 'bottoms', 'shoes', 'bags', 'accessories'];
      els.categoryFilters.innerHTML = categories.map(category => `<button class="chip ${category === activeCategory ? 'active' : ''}" type="button" data-category="${category}">${categoryLabels[category]}</button>`).join('');
    }

    function renderItemFilters() {
      const query = els.itemSearch.value.trim().toLowerCase();
      const items = DATA.items.filter(item => item.enabled)
        .filter(item => activeCategory === 'all' || item.category === activeCategory)
        .filter(item => !query || item.name.toLowerCase().includes(query));
      els.itemFilters.innerHTML = items.map(item => `<button class="chip ${selectedItemIds.has(item.id) ? 'active' : ''}" type="button" data-item="${item.id}">${item.name}</button>`).join('');
      renderSelectedItems();
    }

    function renderSelectedItems() {
      const selected = [...selectedItemIds].map(itemById).filter(Boolean);
      els.selectedItems.innerHTML = selected.map(item => `<button class="chip" type="button" data-remove-item="${item.id}">${item.name} ×</button>`).join('');
    }

    function lookMatches(look) {
      const season = els.seasonFilter.value;
      const weather = els.weatherFilter.value;
      const scene = els.sceneFilter.value;
      const color = els.colorFilter.value;
      if (season !== 'all' && !look.season.includes(season)) return false;
      if (weather !== 'all' && !look.weatherTags.includes(weather)) return false;
      if (scene !== 'all' && look.scene !== scene) return false;
      if ([...selectedItemIds].some(id => !look.items.includes(id))) return false;
      if (color !== 'all') {
        const hasColor = look.items.some(id => itemById(id)?.colors.includes(color));
        if (!hasColor) return false;
      }
      return true;
    }

    function renderCards() {
      const items = DATA.looks.filter(lookMatches);
      els.gallery.innerHTML = items.map(look => {
        const usedItems = look.items.map(itemById).filter(Boolean);
        return `
          <article class="card">
            <header class="card-head">
              <div class="id">${look.id}</div>
              <div class="scene">${look.scene}<br>${look.season.map(key => labelFrom(seasonLabels, key)).join(' / ')}</div>
            </header>
            <div class="fit-visual"><img class="look-photo" src="${look.image}" alt="${look.title} ${look.scene}"></div>
            <div class="details">
              <div class="row"><b>上衣</b><span>${look.slots.top}</span></div>
              <div class="row"><b>下装</b><span>${look.slots.bottom}</span></div>
              <div class="row"><b>鞋</b><span>${look.slots.shoe}</span></div>
              <div class="row"><b>包</b><span>${look.slots.bag}</span></div>
              <div class="row"><b>配饰</b><span>${look.slots.extra}</span></div>
              <div class="tags">${look.weatherTags.map(tag => `<span class="tag">${labelFrom(weatherLabels, tag)}</span>`).join('')}${usedItems.slice(0, 4).map(item => `<span class="tag">${item.name}</span>`).join('')}</div>
              <div class="note">${look.note}</div>
            </div>
          </article>
        `;
      }).join('');
      els.visibleCount.textContent = items.length;
      els.empty.style.display = items.length ? 'none' : 'block';
      renderSummary(items.length);
    }

    function renderSummary(count) {
      const itemText = selectedItemIds.size ? `已选 ${selectedItemIds.size} 个单品` : '未选择单品';
      const weatherText = els.weatherFilter.value === 'all' ? '全部天气' : labelFrom(weatherLabels, els.weatherFilter.value);
      els.activeSummary.textContent = `${count} 套 Look · ${itemText} · ${weatherText}`;
    }

    function resetFilters() {
      selectedItemIds.clear();
      activeCategory = 'all';
      els.itemSearch.value = '';
      els.seasonFilter.value = 'all';
      els.weatherFilter.value = 'all';
      els.sceneFilter.value = 'all';
      els.colorFilter.value = 'all';
      renderCategoryFilters();
      renderItemFilters();
      renderCards();
    }

    async function init() {
      const [itemsRes, looksRes] = await Promise.all([fetch('data/items.json'), fetch('data/looks.json')]);
      DATA.items = await itemsRes.json();
      DATA.looks = await looksRes.json();
      els.lookCount.textContent = DATA.looks.length;
      els.itemCount.textContent = DATA.items.length;
      initControls();
      renderCards();
      loadWeather();
    }

    els.categoryFilters.addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      activeCategory = button.dataset.category;
      renderCategoryFilters();
      renderItemFilters();
    });

    els.itemFilters.addEventListener('click', event => {
      const button = event.target.closest('[data-item]');
      if (!button) return;
      const id = button.dataset.item;
      selectedItemIds.has(id) ? selectedItemIds.delete(id) : selectedItemIds.add(id);
      renderItemFilters();
      renderCards();
    });

    els.selectedItems.addEventListener('click', event => {
      const button = event.target.closest('[data-remove-item]');
      if (!button) return;
      selectedItemIds.delete(button.dataset.removeItem);
      renderItemFilters();
      renderCards();
    });

    els.itemSearch.addEventListener('input', renderItemFilters);
    [els.seasonFilter, els.weatherFilter, els.sceneFilter, els.colorFilter].forEach(select => select.addEventListener('change', renderCards));
    document.querySelector('#resetBtn').addEventListener('click', resetFilters);
    document.querySelector('#clearItemsBtn').addEventListener('click', () => { selectedItemIds.clear(); renderItemFilters(); renderCards(); });
    document.querySelector('#todayBtn').addEventListener('click', () => { if (currentWeatherTag) { els.weatherFilter.value = currentWeatherTag; renderCards(); } });
    document.querySelector('#printBtn').addEventListener('click', () => window.print());

    init().catch(error => {
      els.activeSummary.textContent = '数据加载失败，请检查 data/items.json 和 data/looks.json。';
      els.empty.style.display = 'block';
      els.empty.textContent = String(error.message || error);
    });
  </script>
</body>
</html>
