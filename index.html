<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Louis 夏日胶囊衣橱 72 套核心 Look</title>
  <style>
    :root {
      --ink: #24231f;
      --muted: #6d6a60;
      --paper: #f6f2e9;
      --panel: #fffcf5;
      --line: #d8d0c1;
      --charcoal: #373735;
      --olive: #58614c;
      --navy: #26384f;
      --coffee: #5a4638;
      --khaki: #a89167;
      --cream: #e9ddc8;
      --sage: #87907f;
      --silver: #bcc0bf;
      --pink: #d8a8a8;
      --blue: #4e7297;
      color-scheme: light;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--ink);
      background:
        linear-gradient(90deg, rgba(36,35,31,.035) 1px, transparent 1px) 0 0 / 28px 28px,
        linear-gradient(180deg, rgba(36,35,31,.028) 1px, transparent 1px) 0 0 / 28px 28px,
        var(--paper);
      font-family: "Hiragino Sans GB", "PingFang SC", "Noto Sans CJK SC", sans-serif;
      letter-spacing: 0;
    }

    button, select { font: inherit; }

    .shell {
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
      padding: 28px 0 48px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      margin: 0 -16px 22px;
      padding: 12px 16px;
      background: rgba(246, 242, 233, .92);
      border-bottom: 1px solid rgba(36, 35, 31, .12);
      backdrop-filter: blur(18px);
    }

    .topbar-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 16px;
      align-items: center;
      width: min(1480px, calc(100vw - 32px));
      margin: 0 auto;
    }

    h1 {
      margin: 0;
      font-family: Georgia, "Songti SC", serif;
      font-size: clamp(28px, 4.2vw, 64px);
      line-height: .95;
      font-weight: 500;
      letter-spacing: 0;
    }

    .kicker {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
      margin-top: 10px;
      color: var(--muted);
      font-size: 14px;
    }

    .mark {
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      color: var(--panel);
      background: var(--ink);
      border-radius: 50%;
      font-family: Georgia, serif;
      font-size: 18px;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px;
    }

    .btn, .chip {
      min-height: 36px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 252, 245, .78);
      color: var(--ink);
      padding: 8px 12px;
      cursor: pointer;
    }

    .btn:hover, .chip:hover, .chip.active {
      border-color: var(--ink);
      background: var(--ink);
      color: var(--panel);
    }

    .board {
      display: grid;
      grid-template-columns: 310px 1fr;
      gap: 22px;
      align-items: start;
    }

    aside {
      position: sticky;
      top: 86px;
      border: 1px solid var(--line);
      background: rgba(255, 252, 245, .72);
      padding: 18px;
      min-height: 520px;
    }

    .summary-title {
      margin: 0 0 14px;
      font-size: 15px;
      font-weight: 700;
    }

    .stat-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-bottom: 20px;
    }

    .stat {
      border: 1px solid rgba(36, 35, 31, .14);
      background: rgba(246, 242, 233, .7);
      padding: 10px;
      min-height: 72px;
    }

    .stat strong {
      display: block;
      font-size: 24px;
      line-height: 1;
      font-family: Georgia, serif;
    }

    .stat span {
      display: block;
      margin-top: 7px;
      color: var(--muted);
      font-size: 12px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 18px;
    }

    .weather-strip {
      display: grid;
      gap: 8px;
      margin-bottom: 20px;
    }

    .weather-day {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 9px;
      align-items: center;
      padding: 9px;
      border: 1px solid rgba(36, 35, 31, .13);
      background: rgba(246, 242, 233, .62);
    }

    .weather-date {
      font-family: Georgia, serif;
      font-size: 18px;
      line-height: 1;
    }

    .weather-meta {
      min-width: 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .weather-meta strong {
      display: block;
      color: var(--ink);
      font-size: 13px;
      font-weight: 700;
    }

    .legend {
      display: grid;
      gap: 9px;
      color: var(--muted);
      font-size: 13px;
    }

    .legend-row {
      display: grid;
      grid-template-columns: 18px 1fr;
      gap: 8px;
      align-items: center;
    }

    .dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1px solid rgba(36, 35, 31, .18);
      background: var(--dot);
    }

    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(292px, 1fr));
      gap: 14px;
    }

    .card {
      border: 1px solid rgba(36, 35, 31, .16);
      background: var(--panel);
      min-height: 420px;
      display: grid;
      grid-template-rows: auto 440px 1fr;
      overflow: hidden;
    }

    .card-head {
      display: flex;
      align-items: start;
      justify-content: space-between;
      gap: 10px;
      padding: 14px 14px 8px;
    }

    .id {
      font-family: Georgia, serif;
      font-size: 29px;
      line-height: 1;
    }

    .scene {
      text-align: right;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.4;
    }

    .fit-visual {
      margin: 0 14px;
      border: 1px solid rgba(36, 35, 31, .12);
      background:
        radial-gradient(circle at 22% 18%, rgba(255,255,255,.72) 0 2px, transparent 3px),
        linear-gradient(135deg, rgba(255,255,255,.34), rgba(36,35,31,.05));
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 14px;
      align-items: center;
      padding: 14px;
    }

    .photo-frame {
      display: block;
      padding: 0;
      overflow: hidden;
      background: #e6e1d7;
    }

    .look-photo {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      object-position: center center;
      filter: saturate(.88) contrast(.98);
    }

    .figure {
      width: 78px;
      height: 118px;
      margin: 0 auto;
      position: relative;
    }

    .figure::before {
      content: "";
      position: absolute;
      left: 28px;
      top: 0;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #c6a98d;
      border: 1px solid rgba(36,35,31,.14);
    }

    .top-shape {
      position: absolute;
      left: 16px;
      top: 25px;
      width: 46px;
      height: 42px;
      border-radius: 11px 11px 5px 5px;
      background: var(--top);
      border: 1px solid rgba(36,35,31,.22);
    }

    .top-shape::before,
    .top-shape::after {
      content: "";
      position: absolute;
      top: 7px;
      width: 17px;
      height: 24px;
      background: var(--top);
      border: 1px solid rgba(36,35,31,.18);
    }

    .top-shape::before {
      left: -13px;
      transform: rotate(15deg);
      border-radius: 8px 0 8px 8px;
    }

    .top-shape::after {
      right: -13px;
      transform: rotate(-15deg);
      border-radius: 0 8px 8px 8px;
    }

    .pants-shape {
      position: absolute;
      left: 19px;
      top: 68px;
      width: 40px;
      height: 46px;
      background:
        linear-gradient(90deg, transparent 47%, rgba(36,35,31,.25) 48% 52%, transparent 53%),
        var(--bottom);
      border: 1px solid rgba(36,35,31,.22);
      border-radius: 4px 4px 10px 10px;
    }

    .shoe-line {
      position: absolute;
      left: 12px;
      bottom: 0;
      width: 54px;
      height: 8px;
      border-radius: 999px;
      background: var(--shoe);
      border: 1px solid rgba(36,35,31,.2);
    }

    .swatches {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 7px;
    }

    .swatch {
      height: 64px;
      border: 1px solid rgba(36,35,31,.14);
      background: var(--c);
      position: relative;
      overflow: hidden;
    }

    .swatch::after {
      content: attr(data-label);
      position: absolute;
      left: 6px;
      right: 6px;
      bottom: 5px;
      color: rgba(255,255,255,.92);
      text-shadow: 0 1px 2px rgba(0,0,0,.45);
      font-size: 10px;
      line-height: 1.1;
    }

    .details {
      padding: 12px 14px 14px;
      display: grid;
      gap: 8px;
    }

    .row {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: baseline;
      font-size: 13px;
      line-height: 1.45;
    }

    .row b {
      color: var(--muted);
      font-size: 12px;
      font-weight: 500;
    }

    .weather-pill {
      display: grid;
      grid-template-columns: 42px 1fr;
      gap: 8px;
      align-items: baseline;
      padding: 8px 0 10px;
      border-bottom: 1px dashed rgba(36,35,31,.18);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .weather-pill b {
      color: var(--ink);
      font-size: 12px;
      font-weight: 700;
    }

    .note {
      margin-top: 2px;
      padding-top: 10px;
      border-top: 1px dashed rgba(36,35,31,.18);
      color: var(--muted);
      font-size: 12px;
      line-height: 1.5;
    }

    .empty {
      display: none;
      padding: 32px;
      color: var(--muted);
      border: 1px solid var(--line);
      background: var(--panel);
    }

    @media (max-width: 920px) {
      .topbar-inner, .board { grid-template-columns: 1fr; }
      .actions { justify-content: start; }
      aside { position: static; min-height: auto; }
    }

    @media (max-width: 560px) {
      .shell { width: min(100vw - 18px, 1480px); padding-top: 14px; }
      .topbar { margin: 0 -9px 14px; }
      .gallery { grid-template-columns: 1fr; }
      .card { min-height: 0; }
      .card { grid-template-rows: auto 460px 1fr; }
      .fit-visual { grid-template-columns: 76px 1fr; padding: 10px; gap: 10px; }
      .photo-frame { padding: 0; }
      .swatch { height: 54px; }
    }

    @media print {
      body { background: #fff; }
      .topbar, aside { position: static; }
      .actions, .filters { display: none; }
      .board { display: block; }
      aside { min-height: 0; margin-bottom: 14px; }
      .gallery { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .card { break-inside: avoid; min-height: 385px; }
    }
  </style>
</head>

  </main>

      "70": "assets/louis-summer-looks/look-70.jpg",
      "71": "assets/louis-summer-looks/look-71.jpg",
      "72": "assets/louis-summer-looks/look-72.jpg"
    };

    const colorRules = [
      [/水洗粉|粉色/, "#d8a8a8"],
      [/奶油|浅杏|浅米|米/, "#e9ddc8"],
      [/白蓝红/, "linear-gradient(135deg, #f3f0e8 0 42%, #496b95 43% 62%, #b8483e 63%)"],
      [/蓝盘|藏蓝|深藏蓝/, "#26384f"],
      [/军绿|橄榄|鼠尾草|绿盘/, "#58614c"],
      [/深咖|棕色|咖/, "#5a4638"],
      [/卡其/, "#a89167"],
      [/灰褐/, "#7c7668"],
      [/炭灰|深灰|灰色|灰白|银色|透明灰/, "#8b8b83"],
      [/黑色|黑 T|黑西裤|黑包/, "#262624"]
    ];

    const scenes = ["全部", ...Array.from(new Set(looks.map(look => look.scene)))];
    const gallery = document.querySelector("#gallery");
    const filters = document.querySelector("#filters");
    const weatherStrip = document.querySelector("#weatherStrip");
    const visibleCount = document.querySelector("#visibleCount");
    const empty = document.querySelector("#empty");

    function colorFor(text) {
      const found = colorRules.find(([rule]) => rule.test(text));
      return found ? found[1] : "#b7aa96";
    }

    function renderFilters() {
      filters.innerHTML = scenes.map((scene, index) => (
        `<button class="chip ${index === 0 ? "active" : ""}" type="button" data-scene="${scene}">${scene}</button>`
      )).join("");
    }

    function weatherForLook(look) {
      return weeklyWeather[(Number(look.id) - 1) % weeklyWeather.length];
    }

    function renderWeatherStrip() {
      weatherStrip.innerHTML = weeklyWeather.map(day => `
        <div class="weather-day">
          <div class="weather-date">${day.date}</div>
          <div class="weather-meta">
            <strong>${day.day} · ${day.text}</strong>
            <span>${day.temp} · ${day.uv}</span><br>
            <span>${day.cue}</span>
          </div>
        </div>
      `).join("");
    }

    function renderCards(activeScene = "全部") {
      const items = activeScene === "全部" ? looks : looks.filter(look => look.scene === activeScene);
      gallery.innerHTML = items.map(look => {
        const topColor = colorFor(look.top);
        const bottomColor = colorFor(look.bottom);
        const shoeColor = colorFor(look.shoe);
        const bagColor = colorFor(look.bag);
        const extraColor = colorFor(look.extra);
        const image = lookImages[look.id];
        const weather = weatherForLook(look);
        const visual = image ? `
            <div class="fit-visual photo-frame">
              <img class="look-photo" src="${image}" alt="Look ${look.id} ${look.scene}">
            </div>
        ` : `
            <div class="fit-visual" aria-hidden="true">
              <div class="figure">
                <i class="top-shape"></i>
                <i class="pants-shape"></i>
                <i class="shoe-line"></i>
              </div>
              <div class="swatches">
                <i class="swatch" style="--c:${topColor}" data-label="上衣"></i>
                <i class="swatch" style="--c:${bottomColor}" data-label="下装"></i>
                <i class="swatch" style="--c:${shoeColor}" data-label="鞋"></i>
                <i class="swatch" style="--c:${bagColor}" data-label="包"></i>
                <i class="swatch" style="--c:${extraColor}" data-label="配饰"></i>
              </div>
            </div>
        `;

        return `
          <article class="card" style="--top:${topColor}; --bottom:${bottomColor}; --shoe:${shoeColor}">
            <header class="card-head">
              <div class="id">${look.id}</div>
              <div class="scene">${look.scene}<br>Louis Summer Capsule</div>
            </header>
            ${visual}
            <div class="details">
              <div class="weather-pill"><b>天气</b><span>${weather.date} ${weather.day} · ${weather.text} · ${weather.temp} · ${weather.uv}</span></div>
              <div class="row"><b>上衣</b><span>${look.top}</span></div>
              <div class="row"><b>下装</b><span>${look.bottom}</span></div>
              <div class="row"><b>鞋</b><span>${look.shoe}</span></div>
              <div class="row"><b>包</b><span>${look.bag}</span></div>
              <div class="row"><b>配饰</b><span>${look.extra}</span></div>
              <div class="note">${look.note}</div>
            </div>
          </article>
        `;
      }).join("");

      visibleCount.textContent = items.length;
      empty.style.display = items.length ? "none" : "block";
    }

    renderFilters();
    renderWeatherStrip();
    renderCards();

    filters.addEventListener("click", event => {
      const button = event.target.closest("button[data-scene]");
      if (!button) return;
      filters.querySelectorAll(".chip").forEach(chip => chip.classList.remove("active"));
      button.classList.add("active");
      renderCards(button.dataset.scene);
    });

    document.querySelector("#showAll").addEventListener("click", () => {
      filters.querySelectorAll(".chip").forEach(chip => chip.classList.toggle("active", chip.dataset.scene === "全部"));
      renderCards();
    });

    document.querySelector("#printBtn").addEventListener("click", () => window.print());
  </script>
</body>
